<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Guia Interativo PJe • CSTI</title><style>
:root{--navy:#0c2443;--navy2:#174372;--ink:#142b4c;--muted:#5a6d83;--blue:#276bc0;--border:#dce5f2;--bg:#f3f7fc}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);font:15px/1.5 'Segoe UI',Arial,sans-serif;color:var(--ink)}button{font:inherit;cursor:pointer}
.shell{display:grid;grid-template-columns:258px minmax(0,1fr);min-height:100vh}
.sidebar{background:linear-gradient(155deg,var(--navy),var(--navy2));color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{font-size:33px;font-weight:900;letter-spacing:-2px;line-height:1}.logo i{color:#ff8c21;font-style:normal}.brand b{display:block;font-size:18px;margin-top:8px}.brand small{display:block;color:#d0dded}
.sideheading{font-size:11px;color:#a7c4e9;letter-spacing:1.5px;text-transform:uppercase;margin:24px 10px 10px;font-weight:800}
.nav,.person{width:100%;display:flex;align-items:center;gap:11px;border:1px solid transparent;background:transparent;color:#fff;border-radius:10px;text-align:left;padding:10px 11px;margin:3px 0}
.nav:hover,.person:hover{background:#274c78}.nav.active,.person.active{background:#e3efff;color:#142f52;font-weight:800}.nav .ic{font-size:19px;width:25px;text-align:center}
.person{padding:7px 9px}.person img{width:44px;height:44px;border-radius:50%;object-fit:cover;object-position:center 20%;border:2px solid #aac4ea;background:#eaf2fa}.person span{font-weight:700;font-size:13px}
.main{min-width:0;padding:20px 24px 45px}.top{padding:24px 30px;border:1px solid var(--border);background:linear-gradient(100deg,#e7f0fc,#fff);border-radius:18px;display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:20px}
.top h1{font-size:clamp(26px,3vw,35px);margin:0;line-height:1.15}.top p{margin:4px 0 0;color:var(--muted)}.version{border-radius:50px;background:#dce9fb;border:1px solid #b8cce9;padding:7px 12px;font-size:12px;white-space:nowrap}
.view{display:none}.view.active{display:block}.card{background:#fff;border:1px solid var(--border);border-radius:17px;padding:22px;margin-bottom:16px;box-shadow:0 5px 22px rgba(24,49,85,.045)}
.card h2,.card h3{margin:0 0 10px}.muted{color:var(--muted)}.intro{display:flex;align-items:center;gap:26px;background:linear-gradient(120deg,#e8f2ff,#fff)}.intro img{width:180px;height:180px;border-radius:22px;object-fit:cover;object-position:center 20%;background:#d5e8fc}.intro h2{font-size:29px}.tag{display:inline-block;background:#d4e7ff;color:#1b4a7f;border-radius:40px;padding:5px 12px;font-size:12px;font-weight:800}

.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.option{border:1px solid #dce5f2;border-radius:12px;background:#fff;text-align:left;padding:15px;color:var(--ink)}.option.active{border:2px solid #3278d5;background:#eaf3ff;padding:14px}.option strong,.option small{display:block}.option small{color:var(--muted);margin-top:4px}
.callout{background:#eaf3ff;border:1px solid #c6dcf5;padding:14px 17px;border-radius:13px;margin:12px 0}.callout.warn{background:#fff7e7;border-color:#f1dba8}.route{font-weight:700;color:#205995}.step{background:#fff;border:1px solid var(--border);border-radius:14px;padding:15px;margin:10px 0}.stepheader{display:flex;align-items:center;gap:10px}.number{display:grid;place-items:center;min-width:33px;height:33px;background:#d8eaff;border-radius:50%;color:#1f65ac;font-weight:900}.step h3{font-size:16px;margin:0}.step p{margin:10px 0}.done{display:flex;gap:8px;align-items:center;font-weight:700}.done input{width:17px;height:17px;accent-color:#1e70cd}.progress{height:9px;border-radius:9px;background:#e5edf8;overflow:hidden}.progress div{height:100%;background:#2f82d8;transition:width .2s}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}.btn{border:1px solid #a9c4e4;border-radius:10px;background:#fff;color:#19446e;padding:10px 15px;font-weight:700}.btn.primary{background:#2368b6;color:white;border-color:#2368b6}.btn:hover{filter:brightness(.96)}
details{border:1px solid var(--border);border-radius:12px;padding:13px;margin:9px 0;background:#fff}summary{cursor:pointer;font-weight:800}.metric{display:inline-block;padding:8px 12px;background:#eef5ff;border-radius:12px;margin:5px}.empty{border:1px dashed #bbcee5;border-radius:13px;padding:22px;color:#58708b;background:#f8fbff}.review{font-size:13px;color:#7a5e29}
@media(max-width:850px){.shell{grid-template-columns:1fr}.sidebar{position:static;height:auto}.navgroups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px}.people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.main{padding:12px}.choices,.tilegrid{grid-template-columns:1fr}.intro{flex-direction:column;align-items:flex-start}.top{padding:18px;display:block}.version{display:inline-block;margin-top:12px}}
@media print{.sidebar,.actions,.top .version,.view:not(.active),.tilegrid,.choices{display:none!important}.shell{display:block}.main{padding:0}.card,.step{box-shadow:none;break-inside:avoid}.top{box-shadow:none}}

const LABELS={servidor:'Servidor',estagiario:'Estagiário',magistrado:'Magistrado',oficial:'Oficial de Justiça'};
const EXPLANATION={servidor:'Cadastro, mudança de grau, vinculação de unidade, consulta e exceções.',estagiario:'Verificação do SCA, encaminhamentos, papel e senha.',magistrado:'Cadastro inicial e alterações de lotação.',oficial:'Solicitação justificada de acesso pelo SSSJ.'};
let profile='servidor',scenario=null,completed={},view='home';
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function go(target){view=target;document.querySelectorAll('.view').forEach(e=>e.classList.toggle('active',e.id===view));document.querySelectorAll('.nav').forEach(e=>e.classList.toggle('active',e.dataset.view===view));window.scrollTo({top:0,behavior:'smooth'});render()}
function chooseProfile(p){profile=p;scenario=null;completed={};go('flows')}
function chooseScenario(s){scenario=s;completed={};go('procedures')}
function current(){return data[profile].choices.find(c=>c.id===scenario)}
function summaryText(){
let c=current();return 'GUIA PJe - Central de Serviços de TI\nPerfil: '+LABELS[profile]+'\nSituação: '+(c?c.title:'Não selecionada')+'\n\n'+(c?c.steps.map((s,i)=>(completed[i]?'[x] ':'[ ] ')+(i+1)+'. '+s[0]+': '+s[1].replace(/<[^>]*>/g,'')).join('\n'):'Selecione o cenário na opção Fluxos de atendimento.');
}
async function copyText(){const text=summaryText();try{await navigator.clipboard.writeText(text);alert('Resumo copiado.')}catch(e){window.prompt('Copie o texto:',text)}}
const profileCards=()=>Object.keys(LABELS).map(k=>`<button class="tile" onclick="chooseProfile('${k}')"><img src="${avatars[k]}" alt=""><span><strong>${LABELS[k]}</strong><small>${EXPLANATION[k]}</small></span></button>`).join('');
function render(){
document.getElementById('sidebarPeople').innerHTML=Object.keys(LABELS).map(k=>`<button class="person ${profile===k?'active':''}" onclick="chooseProfile('${k}')" aria-label="Abrir perfil ${LABELS[k]}"><img src="${avatars[k]}" alt=""><span>${LABELS[k]}</span></button>`).join('');
document.getElementById('home').innerHTML=`<div class="card"><span class="tag">Central de Serviços de TI</span><h2 style="font-size:28px;margin-top:10px">Bem-vindo ao Guia de Cadastro e Acesso ao PJe</h2><p class="muted">Selecione um avatar no menu azul ou escolha o perfil abaixo para abrir o atendimento correspondente. Cada cenário possui encaminhamento e checklist próprios.</p><div class="actions"><button class="btn primary" onclick="go('profiles')">Iniciar atendimento</button><button class="btn" onclick="go('exceptions')">Ver alertas e exceções</button></div></div><div class="card"><h2>Selecione o perfil</h2><div class="tilegrid">${profileCards()}</div></div><div class="card"><h3>Como funciona</h3><p><b>1.</b> Escolha o perfil do usuário. <b>2.</b> Identifique a situação. <b>3.</b> Execute o checklist e registre o encaminhamento. <b>4.</b> Copie o resumo ou imprima.</p></div>`;
document.getElementById('profiles').innerHTML=`<div class="card"><h2>Escolha o perfil do usuário</h2><p class="muted">Os avatares também estão disponíveis permanentemente na faixa azul à esquerda.</p><div class="tilegrid">${profileCards()}</div></div>`;
let d=data[profile],cards=d.choices.map(c=>`<button class="option ${scenario===c.id?'active':''}" onclick="chooseScenario('${c.id}')"><strong>${esc(c.title)}</strong><small>${esc(c.sub)}</small></button>`).join('');
document.getElementById('flows').innerHTML=`<div class="card intro"><img src="${avatars[profile]}" alt="Avatar de ${LABELS[profile]}"><div><span class="tag">Perfil selecionado</span><h2>${LABELS[profile]}</h2><p>${esc(d.lead)}</p><button class="btn" onclick="go('profiles')">Trocar perfil</button></div></div><div class="card"><h2>Qual é a situação?</h2><p class="muted">Selecione o cenário para abrir o procedimento e o checklist.</p><div class="choices">${cards}</div></div>`;
const c=current();
